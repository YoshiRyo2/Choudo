# Deploys the fetch service (worker/, "choudo-fetch") to Cloudflare Workers when it or the
# Uniqlo and Zara addresses it calls (packages/core/domain/links/) change on main, or by hand.
# Needs the repo secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID (worker/README.md);
# without them the deploy is skipped with a notice, not failed.
name: Deploy fetch service

on:
  push:
    branches: [main]
    paths:
      - worker/**
      - packages/core/domain/links/**
      - .github/workflows/deploy-worker.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: worker
  cancel-in-progress: false

jobs:
  secrets:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$TOKEN" ] && [ -n "$ACCOUNT" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=Fetch service not deployed::Add the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets (worker/README.md), then re-run this workflow."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: secrets
    if: needs.secrets.outputs.ready == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      # From the repo root (the npm workspace), as deploy-pages.yml does.
      - run: npm ci --ignore-scripts
      - run: npm rebuild esbuild
      - run: npm run check -w worker
      - id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          # No wranglerVersion: the action uses the one npm ci installed (package-lock.json).
          packageManager: npm
      # Our own routes must answer as built; Uniqlo's and Zara's answers are reported, not required.
      # A fresh workers.dev address takes a few minutes to go live, and until then Cloudflare
      # answers 404 with its own HTML page (ours are always JSON), so the size chart is retried
      # every 15 s for up to 3 minutes while that page shows, before the 404 check below.
      - name: Smoke test
        env:
          URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          if [ -z "$URL" ]; then echo "::notice::No deployment URL from wrangler; smoke test skipped."; exit 0; fi
          echo "Fetch service: $URL"
          chart="$URL/uniqlo/E424873-000/size-chart"
          deadline=$((SECONDS + 180))
          while :; do
            read -r status type < <(curl -s -o /dev/null -w '%{http_code} %{content_type}\n' "$chart")
            if [ "$status" != "404" ] || [[ "$type" != text/html* ]] || [ "$SECONDS" -ge "$deadline" ]; then break; fi
            echo "Not live yet ($status, Cloudflare's page); trying again in 15 s."
            sleep 15
          done
          status404=$(curl -s -o /dev/null -w '%{http_code}' "$URL/anything-else")
          if [ "$status404" != "404" ]; then echo "::error::$URL/anything-else answered $status404, not 404"; exit 1; fi
          if [ "$status" = "404" ] && [[ "$type" == text/html* ]]; then
            echo "::warning title=Fetch service not live yet::$chart still shows Cloudflare's 404 page after 3 minutes; try it again in a few minutes."
          elif [ "$status" = "200" ]; then
            echo "::notice title=Fetch service live::$URL (Uniqlo's size chart answered 200)"
          else
            echo "::warning title=Uniqlo didn't answer::$chart answered $status"
          fi
          # Zara may block Cloudflare's addresses: then the website can't read Zara (the phone still can).
          zara_search=$(curl -s "$URL/zara/04174639/search" || true)
          zara_guide=$(curl -s "$URL/zara/616513993/size-guide" || true)
          if [[ "$zara_search" == *04174639* ]] && [[ "$zara_guide" == *measureGuideInfo* ]]; then
            echo "::notice title=Zara answered::$URL/zara/04174639/search and /zara/616513993/size-guide"
          else
            echo "::warning title=Zara didn't answer the fetch service::/zara/04174639/search has the product: $([[ "$zara_search" == *04174639* ]] && echo yes || echo no); /zara/616513993/size-guide has measureGuideInfo: $([[ "$zara_guide" == *measureGuideInfo* ]] && echo yes || echo no)"
          fi
