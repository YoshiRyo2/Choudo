# Checks the workspace (packages/core, app and mobile), builds app/ and deploys it to GitHub
# Pages (https://yoshiryo2.github.io/Choudo/) on every push to main.
# Needs Settings → Pages → Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push waits rather than cancelling one mid-deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      # From the repo root (the npm workspace). No install scripts: the photo tools'
      # model runtime (onnxruntime-node) isn't needed to build. esbuild is rebuilt in
      # case a dependency brings it in.
      - run: npm ci --ignore-scripts
      - run: npm rebuild esbuild
      - run: npm run check
      - run: npm run build -w app
      - run: npm run dist:check -w app
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
