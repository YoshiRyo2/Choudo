<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Choudo app icon: a linen dress form with a tape measure round the chest.
       Colours are the app tokens: ink, form, form-edge, tape (src/ui/styles.css).
       Everything inside #art is the foreground; scripts/icons.mjs shrinks it for
       the maskable (Android) icon. -->
  <rect width="100" height="100" fill="#1b2433"/>
  <g id="art">
    <!-- tape tail, hanging off the right side (drawn under the band) -->
    <path d="M70 43 L76 42.5 L78.8 64 L73 64.8 Z" fill="#f2c12e"/>
    <g stroke="#1b2433" stroke-width="0.9">
      <line x1="70.8" y1="49" x2="73.2" y2="48.7"/>
      <line x1="71.6" y1="54.5" x2="75.2" y2="54.1"/>
      <line x1="72.3" y1="60" x2="74.7" y2="59.7"/>
    </g>
    <path d="M73 64.8 L78.8 64 L79.2 66.8 L73.4 67.6 Z" fill="#b4aa98"/>

    <!-- neck and cap -->
    <path d="M45.4 19.5 L54.6 19.5 L56.2 26.5 L43.8 26.5 Z" fill="#d9d1c3"/>
    <ellipse cx="50" cy="18.6" rx="6" ry="2.6" fill="#b4aa98"/>

    <!-- torso -->
    <path d="M44 25 C38 25.5 32 27 29.5 30 C27.5 32.5 26.6 37 27 41 C27.4 46 30.5 50 34 54
             C36.5 57 38 59 38 62 C38 66 33.5 69.5 33 74 L33 78 Q50 81 67 78 L67 74
             C66.5 69.5 62 66 62 62 C62 59 63.5 57 66 54 C69.5 50 72.6 46 73 41
             C73.4 37 72.5 32.5 70.5 30 C68 27 62 25.5 56 25 Z"
          fill="#d9d1c3"/>
    <!-- princess seams -->
    <g fill="none" stroke="#b4aa98" stroke-width="0.9" stroke-linecap="round">
      <path d="M41.5 27 C40.5 38 43.5 50 44.3 61 C44.7 67 42 72.5 41.5 79.2"/>
      <path d="M58.5 27 C59.5 38 56.5 50 55.7 61 C55.3 67 58 72.5 58.5 79.2"/>
    </g>
    <!-- base rim, pole and foot -->
    <path d="M33 78 Q50 81 67 78 L67 80.6 Q50 83.6 33 80.6 Z" fill="#b4aa98"/>
    <rect x="48.4" y="82" width="3.2" height="8" fill="#b4aa98"/>
    <rect x="40" y="89.5" width="20" height="3.2" rx="1.6" fill="#b4aa98"/>

    <!-- tape round the chest -->
    <path d="M27 38 Q50 44 73 38 L73 45 Q50 51 27 45 Z" fill="#f2c12e"/>
    <g stroke="#1b2433" stroke-width="1">
      <line x1="34" y1="39.55" x2="34" y2="42.05"/>
      <line x1="38" y1="40.18" x2="38" y2="44.18"/>
      <line x1="42" y1="40.64" x2="42" y2="43.14"/>
      <line x1="46" y1="40.91" x2="46" y2="43.41"/>
      <line x1="50" y1="41" x2="50" y2="45.5"/>
      <line x1="54" y1="40.91" x2="54" y2="43.41"/>
      <line x1="58" y1="40.64" x2="58" y2="43.14"/>
      <line x1="62" y1="40.18" x2="62" y2="44.18"/>
      <line x1="66" y1="39.55" x2="66" y2="42.05"/>
    </g>
  </g>
</svg>
